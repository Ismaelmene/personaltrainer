<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Meu Personal</title>
<meta name="theme-color" content="#0F1115">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#0F1115; --surface:#171A21; --surface2:#20242E; --surface3:#282D3A;
  --border:#2A2F3A; --text:#F2F3F5; --muted:#8B92A0; --muted2:#5C6270;
  --accent:#FF3B30; --accent-dark:#D42A21; --accent-ink:#FFFFFF;
  --orange:#FF7A45; --danger:#FF5C5C; --success:#3DDC97;
  --radius:14px; --radius-sm:9px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
h1,h2,h3,.font-display{font-family:'Oswald',sans-serif; letter-spacing:.02em; text-transform:uppercase;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm); padding:10px 12px; width:100%; font-size:14px;}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent);}
::placeholder{color:var(--muted2);}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 18px; border-radius:999px; font-weight:600; font-size:13px; border:none; transition:.15s; white-space:nowrap;}
.btn-accent{background:var(--accent); color:var(--accent-ink);}
.btn-accent:hover{background:var(--accent-dark);}
.btn-ghost{background:var(--surface2); color:var(--text); border:1px solid var(--border);}
.btn-ghost:hover{background:var(--surface3);}
.btn-danger{background:rgba(255,92,92,.12); color:var(--danger); border:1px solid rgba(255,92,92,.3);}
.btn-danger:hover{background:rgba(255,92,92,.2);}
.btn-sm{padding:7px 13px; font-size:12px;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px;}
.pill{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
.pill-green{background:rgba(61,220,151,.14); color:var(--success);}
.pill-orange{background:rgba(255,122,69,.14); color:var(--orange);}
.pill-red{background:rgba(255,92,92,.14); color:var(--danger);}
.pill-gray{background:var(--surface3); color:var(--muted);}
.label{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; margin-bottom:6px; display:block;}
.hidden{display:none !important;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--surface3); border-radius:8px;}
.spinner{width:22px;height:22px;border:3px solid var(--surface3);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.tab-btn{padding:9px 16px; border-radius:999px; font-size:13px; font-weight:600; background:transparent; color:var(--muted); border:1px solid transparent;}
.tab-btn.active{background:var(--surface3); color:var(--accent); border-color:var(--border);}
.nav-item{display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:var(--radius-sm); color:var(--muted); font-weight:600; font-size:13.5px; cursor:pointer; transition:.15s;}
.nav-item:hover{background:var(--surface2); color:var(--text);}
.nav-item.active{background:var(--accent); color:var(--accent-ink);}
.modal-bg{position:fixed; inset:0; background:rgba(5,6,8,.75); backdrop-filter:blur(3px); z-index:50; display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; padding:24px 14px;}
.modal-box{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); width:100%; max-width:560px; padding:24px; margin:auto;}
.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--surface3); border:1px solid var(--border); padding:12px 20px; border-radius:999px; font-size:13px; font-weight:600; z-index:99; box-shadow:0 8px 24px rgba(0,0,0,.4);}
.toast.err{color:var(--danger); border-color:rgba(255,92,92,.4);}
.toast.ok{color:var(--success); border-color:rgba(61,220,151,.4);}
.exercise-row{display:grid; grid-template-columns:1fr 60px 60px 70px 70px 1fr auto; gap:6px; align-items:center; margin-bottom:6px;}
@media(max-width:760px){.exercise-row{grid-template-columns:1fr 1fr; }}
.food-row{display:grid; grid-template-columns:1fr 90px 90px auto; gap:6px; align-items:center; margin-bottom:6px;}
.sidebar{width:230px; background:var(--surface); border-right:1px solid var(--border); flex-shrink:0; display:flex; flex-direction:column; padding:18px 14px;}
@media(max-width:900px){.sidebar{position:fixed; z-index:40; height:100vh; transform:translateX(-100%); transition:.2s;} .sidebar.open{transform:translateX(0);}}
.stat-num{font-family:'Oswald',sans-serif; font-size:32px; font-weight:700; line-height:1;}
.check-circle{width:22px;height:22px;border-radius:50%;border:2px solid var(--border); flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center;}
.check-circle.done{background:var(--accent); border-color:var(--accent);}
</style>
</head>
<body>

<div id="toast-area"></div>

<!-- LOADING -->
<div id="screen-loading" style="height:100vh; display:flex; align-items:center; justify-content:center;">
  <div class="spinner"></div>
</div>

<!-- LOGIN -->
<div id="screen-login" class="hidden" style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">
  <div style="width:100%; max-width:400px;">
    <div style="text-align:center; margin-bottom:28px;">
      <div class="font-display" style="font-size:26px; color:var(--accent);">MEU PERSONAL</div>
      <div style="color:var(--muted); font-size:13px; margin-top:4px;">Treinos, dieta e financeiro em um só lugar</div>
    </div>
    <div class="card">
      <div style="display:flex; gap:8px; margin-bottom:18px;">
        <button class="tab-btn active" id="tab-role-personal" onclick="setLoginRole('personal')" style="flex:1;">Sou Personal</button>
        <button class="tab-btn" id="tab-role-aluno" onclick="setLoginRole('aluno')" style="flex:1;">Sou Aluno</button>
      </div>

      <div id="login-form-area"></div>

      <div id="personal-toggle-area" style="text-align:center; margin-top:16px; font-size:13px; color:var(--muted);">
        <span id="toggle-text">Ainda não tem conta?</span>
        <a href="javascript:void(0)" onclick="toggleAuthMode()" style="color:var(--accent); font-weight:600;" id="toggle-link">Criar conta de personal</a>
      </div>
    </div>
  </div>
</div>

<!-- APP PERSONAL -->
<div id="screen-personal" class="hidden" style="display:flex; min-height:100vh;">
  <div class="sidebar" id="sidebar">
    <div class="font-display" style="font-size:19px; color:var(--accent); padding:6px 10px 22px;">MEU PERSONAL</div>
    <div class="nav-item active" data-view="dashboard" onclick="goPersonalView('dashboard')">📊 Dashboard</div>
    <div class="nav-item" data-view="alunos" onclick="goPersonalView('alunos')">👥 Alunos</div>
    <div class="nav-item" data-view="agenda" onclick="goPersonalView('agenda')">📅 Agenda</div>
    <div class="nav-item" data-view="financeiro" onclick="goPersonalView('financeiro')">💰 Financeiro</div>
    <div style="flex:1;"></div>
    <div style="border-top:1px solid var(--border); padding-top:14px; margin-top:14px;">
      <div style="font-size:12px; color:var(--muted); padding:0 10px 10px;" id="personal-name-label"></div>
      <div class="nav-item" onclick="doLogout()">🚪 Sair</div>
    </div>
  </div>
  <div style="flex:1; min-width:0;">
    <div style="display:none; padding:14px; border-bottom:1px solid var(--border);" id="mobile-topbar">
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ Menu</button>
    </div>
    <div id="personal-content" style="padding:26px; max-width:1100px;"></div>
  </div>
</div>

<!-- APP ALUNO -->
<div id="screen-aluno" class="hidden" style="min-height:100vh; padding-bottom:80px;">
  <div style="padding:20px 20px 10px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border);">
    <div>
      <div class="font-display" style="font-size:18px; color:var(--accent);">MEU PERSONAL</div>
      <div style="font-size:12px; color:var(--muted);" id="aluno-name-label"></div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()">Sair</button>
  </div>
  <div id="aluno-content" style="padding:20px; max-width:700px; margin:0 auto;"></div>
  <div style="position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border); display:flex; padding:8px; gap:4px; z-index:30;">
    <div class="nav-item aluno-tab active" data-view="treino" onclick="goAlunoView('treino')" style="flex:1; flex-direction:column; text-align:center; font-size:11px;">🏋️🥗<br>Treino/Dieta</div>
    <div class="nav-item aluno-tab" data-view="progresso" onclick="goAlunoView('progresso')" style="flex:1; flex-direction:column; text-align:center; font-size:11px;">📈<br>Progresso</div>
    <div class="nav-item aluno-tab" data-view="financeiro" onclick="goAlunoView('financeiro')" style="flex:1; flex-direction:column; text-align:center; font-size:11px;">💰<br>Financeiro</div>
    <div class="nav-item aluno-tab" data-view="agenda" onclick="goAlunoView('agenda')" style="flex:1; flex-direction:column; text-align:center; font-size:11px;">📅<br>Agenda</div>
  </div>
</div>

<script>
/* ============ FIREBASE CONFIG ============
   Substitua pelos dados do SEU projeto Firebase (Configurações do projeto > Geral > Seus apps > SDK) */
const firebaseConfig = {
  apiKey: "AIzaSyDI5wDHuNtTUC5JJIxwQcHnHdcmW2Tc94Y",
  authDomain: "personaltrainer-89775.firebaseapp.com",
  projectId: "personaltrainer-89775",
  storageBucket: "personaltrainer-89775.firebasestorage.app",
  messagingSenderId: "680074332191",
  appId: "1:680074332191:web:e902c56d65482d97baad2a"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* ============ ESTADO GLOBAL ============ */
let currentUser = null; // {uid, role, name, email, trainerId?}
let currentAlunoDoc = null; // objeto aluno quando logado como aluno
let loginRole = 'personal';
let authMode = 'login'; // login | signup (só personal pode signup)
let personalView = 'dashboard';
let alunoView = 'treino';
let selectedAlunoId = null;
let alunoDetailTab = 'perfil';
let alunosListCache = [];
let pesoChart = null;

/* ============ UTIL ============ */
function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' '+type : '');
  el.textContent = msg;
  document.getElementById('toast-area').appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}
function fmtMoney(v){ return 'R$ ' + (Number(v)||0).toFixed(2).replace('.',','); }
function fmtDate(d){
  if(!d) return '-';
  const dt = (d.toDate) ? d.toDate() : new Date(d);
  return dt.toLocaleDateString('pt-BR');
}
function todayStr(){ return new Date().toISOString().split('T')[0]; }
function uid(){ return Math.random().toString(36).slice(2,10); }
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ============ AUTH ============ */
function setLoginRole(role){
  loginRole = role;
  document.getElementById('tab-role-personal').classList.toggle('active', role==='personal');
  document.getElementById('tab-role-aluno').classList.toggle('active', role==='aluno');
  document.getElementById('personal-toggle-area').classList.toggle('hidden', role==='aluno');
  authMode = 'login';
  renderLoginForm();
}
function toggleAuthMode(){
  authMode = authMode==='login' ? 'signup' : 'login';
  renderLoginForm();
}
function renderLoginForm(){
  const area = document.getElementById('login-form-area');
  const isSignup = authMode==='signup' && loginRole==='personal';
  document.getElementById('toggle-text').textContent = isSignup ? 'Já tem conta?' : 'Ainda não tem conta?';
  document.getElementById('toggle-link').textContent = isSignup ? 'Fazer login' : 'Criar conta de personal';
  area.innerHTML = `
    ${isSignup ? `<div style="margin-bottom:10px;"><label class="label">Nome</label><input id="in-nome" placeholder="Seu nome"></div>` : ''}
    <div style="margin-bottom:10px;"><label class="label">Email</label><input id="in-email" type="email" placeholder="voce@email.com"></div>
    <div style="margin-bottom:16px;"><label class="label">Senha</label><input id="in-senha" type="password" placeholder="••••••••"></div>
    <button class="btn btn-accent" style="width:100%;" onclick="submitAuth()">${isSignup ? 'Criar conta' : 'Entrar'}</button>
  `;
}
async function submitAuth(){
  const email = document.getElementById('in-email').value.trim();
  const senha = document.getElementById('in-senha').value;
  if(!email || !senha){ toast('Preencha email e senha','err'); return; }
  try{
    if(authMode==='signup' && loginRole==='personal'){
      const nome = document.getElementById('in-nome').value.trim();
      if(!nome){ toast('Informe seu nome','err'); return; }
      const cred = await auth.createUserWithEmailAndPassword(email, senha);
      await db.collection('users').doc(cred.user.uid).set({role:'personal', name:nome, email, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
    } else {
      await auth.signInWithEmailAndPassword(email, senha);
    }
  }catch(err){
    toast(traduzErro(err), 'err');
  }
}
function traduzErro(err){
  const map = {
    'auth/invalid-email':'Email inválido',
    'auth/user-not-found':'Usuário não encontrado',
    'auth/wrong-password':'Senha incorreta',
    'auth/invalid-credential':'Email ou senha incorretos',
    'auth/email-already-in-use':'Este email já está em uso',
    'auth/weak-password':'A senha precisa ter pelo menos 6 caracteres'
  };
  return map[err.code] || err.message || 'Erro inesperado';
}
function doLogout(){ auth.signOut(); }

auth.onAuthStateChanged(async (user) => {
  hideAllScreens();
  if(!user){
    currentUser = null; currentAlunoDoc = null;
    document.getElementById('screen-login').classList.remove('hidden');
    setLoginRole('personal');
    return;
  }
  document.getElementById('screen-loading').classList.remove('hidden');
  try{
    const userDoc = await db.collection('users').doc(user.uid).get();
    if(!userDoc.exists){ toast('Cadastro incompleto. Contate o suporte.','err'); auth.signOut(); return; }
    const data = userDoc.data();
    currentUser = {uid:user.uid, role:data.role, name:data.name, email:data.email, trainerId:data.trainerId||null};
    if(data.role==='personal'){
      document.getElementById('personal-name-label').textContent = data.name;
      hideAllScreens();
      document.getElementById('screen-personal').classList.remove('hidden');
      updateMobileTopbar();
      goPersonalView('dashboard');
    } else {
      const q = await db.collection('alunos').where('uid','==',user.uid).limit(1).get();
      if(q.empty){ toast('Aluno não encontrado','err'); auth.signOut(); return; }
      currentAlunoDoc = {id:q.docs[0].id, ...q.docs[0].data()};
      document.getElementById('aluno-name-label').textContent = 'Olá, ' + (data.name||'').split(' ')[0];
      hideAllScreens();
      document.getElementById('screen-aluno').classList.remove('hidden');
      goAlunoView('treino');
    }
  }catch(err){
    console.error(err); toast('Erro ao carregar dados: '+err.message,'err');
  }
});
function hideAllScreens(){
  ['screen-loading','screen-login','screen-personal','screen-aluno'].forEach(id=>document.getElementById(id).classList.add('hidden'));
}
function updateMobileTopbar(){
  document.getElementById('mobile-topbar').style.display = window.innerWidth <= 900 ? 'block' : 'none';
}
window.addEventListener('resize', updateMobileTopbar);

/* =========================================================
   PERSONAL — NAVEGAÇÃO
   ========================================================= */
function goPersonalView(view){
  personalView = view; selectedAlunoId = null;
  document.querySelectorAll('#sidebar .nav-item[data-view]').forEach(el=>el.classList.toggle('active', el.dataset.view===view));
  document.getElementById('sidebar').classList.remove('open');
  const c = document.getElementById('personal-content');
  c.innerHTML = '<div class="spinner"></div>';
  const run = async () => {
    try{
      if(view==='dashboard') await renderDashboard();
      else if(view==='alunos') await renderAlunosList();
      else if(view==='agenda') await renderAgendaGeral();
      else if(view==='financeiro') await renderFinanceiroGeral();
    }catch(err){
      console.error(err);
      c.innerHTML = `<div class="card" style="border-color:var(--danger);">
        <div style="color:var(--danger); font-weight:600; margin-bottom:6px;">Erro ao carregar dados</div>
        <div style="font-size:13px; color:var(--muted);">${escapeHtml(err.message||String(err))}</div>
        <div style="font-size:12px; color:var(--muted); margin-top:8px;">Confira se o Firestore foi criado e se as regras (firestore.rules) foram publicadas no Firebase Console.</div>
      </div>`;
    }
  };
  run();
}

/* ---------- DASHBOARD ---------- */
async function renderDashboard(){
  const snap = await db.collection('alunos').where('trainerId','==',currentUser.uid).get();
  const alunos = snap.docs.map(d=>({id:d.id, ...d.data()}));
  alunosListCache = alunos;
  const ativos = alunos.filter(a=>a.ativo!==false).length;
  const hoje = new Date();
  const diaSemanaHoje = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][hoje.getDay()];
  let treinosHoje = 0;
  alunos.forEach(a=>{ (a.treino?.dias||[]).forEach(d=>{ if(d.diaSemana===diaSemanaHoje) treinosHoje++; }); });

  // pagamentos pendentes (checagem rápida via subcollections em paralelo)
  let pendentes = 0;
  await Promise.all(alunos.map(async a=>{
    const pg = await db.collection('alunos').doc(a.id).collection('financeiro').where('status','in',['pendente','atrasado']).get();
    pendentes += pg.size;
  }));

  const c = document.getElementById('personal-content');
  c.innerHTML = `
    <h1 style="font-size:24px; margin-bottom:4px;">Dashboard</h1>
    <div style="color:var(--muted); font-size:13px; margin-bottom:22px;">Visão geral da sua consultoria</div>
    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:24px;">
      <div class="card"><div class="label">Alunos ativos</div><div class="stat-num" style="color:var(--accent);">${ativos}</div></div>
      <div class="card"><div class="label">Treinos hoje (${diaSemanaHoje})</div><div class="stat-num">${treinosHoje}</div></div>
      <div class="card"><div class="label">Pagamentos pendentes</div><div class="stat-num" style="color:${pendentes>0?'var(--orange)':'var(--text)'};">${pendentes}</div></div>
      <div class="card"><div class="label">Total de alunos</div><div class="stat-num">${alunos.length}</div></div>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 style="font-size:15px; margin:0;">Alunos recentes</h3>
      <button class="btn btn-accent btn-sm" onclick="goPersonalView('alunos')">Ver todos</button>
    </div>
    <div style="display:flex; flex-direction:column; gap:8px;">
      ${alunos.slice(0,5).map(a=>`
        <div class="card" style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="openAlunoDetail('${a.id}')">
          <div>
            <div style="font-weight:600;">${escapeHtml(a.nome)}</div>
            <div style="font-size:12px; color:var(--muted);">${escapeHtml(a.objetivo||'Sem objetivo definido')}</div>
          </div>
          <span class="pill ${a.ativo!==false?'pill-green':'pill-gray'}">${a.ativo!==false?'Ativo':'Inativo'}</span>
        </div>`).join('') || '<div class="card" style="text-align:center; color:var(--muted);">Nenhum aluno cadastrado ainda</div>'}
    </div>
  `;
}

/* ---------- ALUNOS: LISTA ---------- */
async function renderAlunosList(){
  const snap = await db.collection('alunos').where('trainerId','==',currentUser.uid).get();
  alunosListCache = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
  const c = document.getElementById('personal-content');
  c.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px;">
      <h1 style="font-size:24px; margin:0;">Alunos</h1>
      <button class="btn btn-accent" onclick="openNovoAlunoModal()">+ Novo aluno</button>
    </div>
    <input placeholder="Buscar aluno..." style="margin-bottom:16px;" oninput="filterAlunos(this.value)">
    <div id="alunos-list-wrap" style="display:flex; flex-direction:column; gap:8px;"></div>
  `;
  renderAlunosListRows(alunosListCache);
}
function renderAlunosListRows(list){
  const wrap = document.getElementById('alunos-list-wrap');
  if(!list.length){ wrap.innerHTML = '<div class="card" style="text-align:center; color:var(--muted);">Nenhum aluno encontrado</div>'; return; }
  wrap.innerHTML = list.map(a=>`
    <div class="card" style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="openAlunoDetail('${a.id}')">
      <div>
        <div style="font-weight:600;">${escapeHtml(a.nome)}</div>
        <div style="font-size:12px; color:var(--muted);">${escapeHtml(a.email)} · ${fmtMoney(a.mensalidade?.valor)}/mês</div>
      </div>
      <span class="pill ${a.ativo!==false?'pill-green':'pill-gray'}">${a.ativo!==false?'Ativo':'Inativo'}</span>
    </div>

async function criarAluno(){
  const nome = document.getElementById('na-nome').value.trim();
  const email = document.getElementById('na-email').value.trim();
  const senha = document.getElementById('na-senha').value;
  if(!nome || !email || !senha || senha.length<6){ toast('Preencha nome, email e senha (mín. 6 caracteres)','err'); return; }
  const btn = document.getElementById('btn-criar-aluno'); btn.disabled = true; btn.textContent = 'Criando...';
  try{

    const resp = await fetch('/api/create-aluno', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+idToken},
      body: JSON.stringify({
        nome, email, senha,
        telefone: document.getElementById('na-telefone').value.trim(),
        dataNascimento: document.getElementById('na-nasc').value,
        objetivo: document.getElementById('na-objetivo').value.trim(),
        mensalidadeValor: document.getElementById('na-mensalidade').value,
        diaVencimento: document.getElementById('na-vencimento').value
      })
    });
    const data = await resp.json();
    if(!resp.ok) throw new Error(data.error || 'Erro ao criar aluno');
    toast('Aluno criado com sucesso!','ok');
    document.getElementById('modal-novo-aluno').remove();
    renderAlunosList();
  }catch(err){
    toast(err.message,'err');
    btn.disabled = false; btn.textContent = 'Criar aluno';
  }
}

let planoEdit = null;
let planoSemanaAtiva = 0;
function migrarPlanoLegado(aluno){

}
function renderTabTreino(box, aluno){

  `;
  renderPlanoSemanasTabs();
  renderPlanoConteudo();
}
function setPlanoTipo(val){
  planoEdit.tipo = val;
  if(val==='semanal'){ planoEdit.semanas = [planoEdit.semanas[0]]; planoSemanaAtiva = 0; }
  renderPlanoSemanasTabs();
  renderPlanoConteudo();
}
function renderPlanoSemanasTabs(){
  const wrap = document.getElementById('plano-semanas-tabs');
  if(planoEdit.tipo!=='mensal'){ wrap.innerHTML=''; return; }
  wrap.innerHTML = `
    <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:6px;">
      ${planoEdit.semanas.map((s,i)=>`
        <button class="tab-btn ${planoSemanaAtiva===i?'active':''}" onclick="trocarSemana(${i})">Semana ${s.numero}</button>
      `).join('')}
      <button class="btn btn-ghost btn-sm" onclick="addSemana()">+ Semana</button>
      ${planoEdit.semanas.length>1 ? `<button class="btn btn-ghost btn-sm" onclick="removeSemana(${planoSemanaAtiva})">Remover semana atual</button>` : ''}
      ${planoEdit.semanas.length>1 ? `<button class="btn btn-accent btn-sm" onclick="duplicarSemana1()">Repetir semana 1 nas demais</button>` : ''}
    </div>
  `;
}
function trocarSemana(i){ planoSemanaAtiva = i; renderPlanoSemanasTabs(); renderPlanoConteudo(); }
function addSemana(){ planoEdit.semanas.push({numero: planoEdit.semanas.length+1, dias:[], refeicoes:[]}); planoSemanaAtiva = planoEdit.semanas.length-1; renderPlanoSemanasTabs(); renderPlanoConteudo(); }
function removeSemana(i){
  if(planoEdit.semanas.length<=1) return;
  planoEdit.semanas.splice(i,1);
  planoEdit.semanas.forEach((s,idx)=>s.numero=idx+1);
  planoSemanaAtiva = Math.max(0, i-1);
  renderPlanoSemanasTabs(); renderPlanoConteudo();
}
function duplicarSemana1(){
  const base = planoEdit.semanas[0];
  for(let i=1;i<planoEdit.semanas.length;i++){
    planoEdit.semanas[i].dias = JSON.parse(JSON.stringify(base.dias)).map(d=>({...d, id:uid(), exercicios:(d.exercicios||[]).map(e=>({...e, id:uid()}))}));
    planoEdit.semanas[i].refeicoes = JSON.parse(JSON.stringify(base.refeicoes)).map(r=>({...r, id:uid(), alimentos:(r.alimentos||[]).map(a=>({...a, id:uid()}))}));
  }
  toast('Semana 1 replicada para as demais','ok');
  renderPlanoConteudo();
}

  renderTreinoDias();
  renderRefeicoes();
}
const DIAS_SEMANA_LISTA = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
function diaAplicaHoje(dia){
  const hojeNome = DIAS_SEMANA_LISTA_COM_DOMINGO()[new Date().getDay()];
  if(dia.tipoRepeticao==='periodo' && dia.dataInicio && dia.dataFim){
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const ini = new Date(dia.dataInicio+'T00:00:00');
    const fim = new Date(dia.dataFim+'T23:59:59');
    return hoje >= ini && hoje <= fim;
  }
  const lista = dia.diasSemana!==undefined ? dia.diasSemana : (dia.diaSemana ? [dia.diaSemana] : []);
  if(!lista || !lista.length) return true; // nenhum dia marcado = vale todo dia
  return lista.includes(hojeNome);
}
function DIAS_SEMANA_LISTA_COM_DOMINGO(){ return ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado']; }

    const tipo = dia.tipoRepeticao || 'dias_semana';

    return `

          <button class="tab-btn ${tipo==='periodo'?'active':''}" onclick="setDiaTipoRepeticao(${di},'periodo')">Período de datas</button>
        </div>
        ${tipo==='dias_semana' ? `
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            ${DIAS_SEMANA_LISTA.map(d=>`<button class="tab-btn ${diasSel.includes(d)?'active':''}" onclick="toggleDiaSemanaChip(${di},'${d}')">${d.slice(0,3)}</button>`).join('')}

        ` : `

            <div><label class="label">De</label><input type="date" value="${dia.dataInicio||''}" oninput="semanaAtual().dias[${di}].dataInicio=this.value" style="max-width:160px;"></div>
            <div><label class="label">Até</label><input type="date" value="${dia.dataFim||''}" oninput="semanaAtual().dias[${di}].dataFim=this.value" style="max-width:160px;"></div>

        `}
      </div>
      <div class="exercise-row" style="font-size:11px; color:var(--muted); font-weight:600;">
        <div>Exercício</div><div>Séries</div><div>Reps</div><div>Carga</div><div>Desc.</div><div>Obs</div><div></div>

      ${(dia.exercicios||[]).map((ex,ei)=>`
        <div class="exercise-row">

          <input value="${escapeHtml(ex.carga||'')}" placeholder="kg" oninput="semanaAtual().dias[${di}].exercicios[${ei}].carga=this.value">
          <input value="${escapeHtml(ex.descanso||'')}" placeholder="60s" oninput="semanaAtual().dias[${di}].exercicios[${ei}].descanso=this.value">
          <input value="${escapeHtml(ex.obs||'')}" placeholder="obs" oninput="semanaAtual().dias[${di}].exercicios[${ei}].obs=this.value">
          <button class="btn btn-ghost btn-sm" onclick="removeExercicio(${di},${ei})">✕</button>

      `).join('')}
      <button class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="addExercicio(${di})">+ Exercício</button>
    </div>
  `;}).join('');
}
function setDiaTipoRepeticao(di, tipo){
  const dia = semanaAtual().dias[di];
  dia.tipoRepeticao = tipo;
  if(tipo==='dias_semana' && !dia.diasSemana) dia.diasSemana = dia.diaSemana ? [dia.diaSemana] : [];
  if(tipo==='periodo'){ if(!dia.dataInicio) dia.dataInicio=''; if(!dia.dataFim) dia.dataFim=''; }

function toggleDiaSemanaChip(di, diaNome){

  if(idx>=0) dia.diasSemana.splice(idx,1); else dia.diasSemana.push(diaNome);
  renderTreinoDias();
}

function setRefeicaoTipoRepeticao(ri, tipo){
  const ref = semanaAtual().refeicoes[ri];
  ref.tipoRepeticao = tipo;
  if(tipo==='dias_semana' && !ref.diasSemana) ref.diasSemana = [];
  if(tipo==='periodo'){ if(!ref.dataInicio) ref.dataInicio=''; if(!ref.dataFim) ref.dataFim=''; }
  renderRefeicoes();
}
function toggleRefeicaoDiaSemanaChip(ri, diaNome){
  const ref = semanaAtual().refeicoes[ri];
  if(!ref.diasSemana) ref.diasSemana = [];
  const idx = ref.diasSemana.indexOf(diaNome);
  if(idx>=0) ref.diasSemana.splice(idx,1); else ref.diasSemana.push(diaNome);
  renderRefeicoes();
}
function addRefeicao(){ semanaAtual().refeicoes.push({id:uid(), horario:'', nome:'', tipoRepeticao:'dias_semana', diasSemana:[], dataInicio:'', dataFim:'', alimentos:[], obs:''}); renderRefeicoes(); }
function removeRefeicao(ri){ semanaAtual().refeicoes.splice(ri,1); renderRefeicoes(); }
function addAlimento(ri){ const r=semanaAtual().refeicoes[ri]; if(!r.alimentos) r.alimentos=[]; r.alimentos.push({id:uid(), nome:'', quantidade:'', unidade:'g'}); renderRefeicoes(); }
function removeAlimento(ri,ai){ semanaAtual().refeicoes[ri].alimentos.splice(ai,1); renderRefeicoes(); }

let alunoSemanaAtiva = null;
function calcSemanaAtualIndex(qtd){ const dia = new Date().getDate(); return Math.min(Math.floor((dia-1)/7), qtd-1); }
function labelRepeticao(dia){
  if(dia.tipoRepeticao==='periodo' && dia.dataInicio && dia.dataFim) return `${fmtDate(new Date(dia.dataInicio+'T00:00:00'))} até ${fmtDate(new Date(dia.dataFim+'T00:00:00'))}`;
  const lista = dia.diasSemana || (dia.diaSemana?[dia.diaSemana]:[]);
  return lista.join(', ') || 'Sem dia definido';
}
async function renderAlunoPlano(c){
  const plano = migrarPlanoLegado(currentAlunoDoc);
  const semanas = plano.semanas && plano.semanas.length ? plano.semanas : [{numero:1, dias:[], refeicoes:[]}];
  if(alunoSemanaAtiva===null || alunoSemanaAtiva>=semanas.length){
    alunoSemanaAtiva = plano.tipo==='mensal' ? calcSemanaAtualIndex(semanas.length) : 0;
  }
  const sem = semanas[alunoSemanaAtiva];
  const hoje = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][new Date().getDay()];
  const checkSnap = await db.collection('alunos').doc(currentAlunoDoc.id).collection('checkins').where('dataStr','==', todayStr()).get();
  const feitosHoje = new Set();
  let treinosConcluidosHoje = [];
  let refeicoesFeitasHoje = new Set();
  checkSnap.docs.forEach(d => {
    const data = d.data();
    (data.exerciciosFeitos||[]).forEach(id=>feitosHoje.add(id));
    treinosConcluidosHoje = data.treinosConcluidos||[];
    (data.refeicoesFeitas||[]).forEach(id=>refeicoesFeitasHoje.add(id));
  });
  const refeicoesTodas = (sem.refeicoes||[]).slice().sort((a,b)=>(a.horario||'').localeCompare(b.horario||''));
  const refeicoesHoje = refeicoesTodas.filter(diaAplicaHoje).filter(r=>!refeicoesFeitasHoje.has(r.id));
  const refeicoesConcluidasHoje = refeicoesTodas.filter(diaAplicaHoje).filter(r=>refeicoesFeitasHoje.has(r.id));
  const outrasRefeicoes = refeicoesTodas.filter(r=>!diaAplicaHoje(r));
  const todosDias = sem.dias || [];
  const diasHoje = todosDias.filter(diaAplicaHoje);
  const outrosDias = todosDias.filter(d=>!diaAplicaHoje(d));

  const cardTreino = (dia, ehHoje) => {
    const idsExercicios = (dia.exercicios||[]).map(e=>e.id);
    const concluido = treinosConcluidosHoje.some(t=>t.id===dia.id);
    return `
    <div class="card" style="margin-bottom:14px; ${ehHoje?'border-color:var(--accent);':''}">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
        <div style="font-weight:700;">${escapeHtml(dia.nomeTreino||'Treino')}</div>
        ${ehHoje ? '<span class="pill pill-green">Hoje</span>' : ''}
      </div>
      <div style="font-size:11px; color:var(--muted); margin-bottom:10px;">${escapeHtml(labelRepeticao(dia))}</div>
      ${(dia.exercicios||[]).map(ex=>`
        <div style="display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--border);">
          <div class="check-circle ${feitosHoje.has(ex.id)?'done':''}" onclick="toggleCheckin('${dia.id}','${ex.id}', this)"></div>
          <div style="flex:1;">
            <div style="font-weight:600; font-size:14px;">${escapeHtml(ex.nome)}</div>
            <div style="font-size:12px; color:var(--muted);">${ex.series||'-'}x${ex.reps||'-'} · ${ex.carga||'-'}kg · desc ${ex.descanso||'-'} ${ex.obs?'· '+escapeHtml(ex.obs):''}</div>
          </div>
        </div>
      `).join('') || '<div style="color:var(--muted); font-size:13px;">Sem exercícios cadastrados</div>'}
      ${ehHoje && idsExercicios.length ? `
        <button class="btn ${concluido?'btn-ghost':'btn-accent'}" style="width:100%; margin-top:12px;" ${concluido?'disabled':''} onclick="concluirTreino('${dia.id}','${escapeHtml(dia.nomeTreino||'Treino').replace(/'/g,"\\'")}', ${JSON.stringify(idsExercicios).replace(/"/g,'&quot;')})">
          ${concluido? '✅ Treino concluído hoje' : '✅ Concluir treino de hoje'}
        </button>` : ''}
    </div>`;
  };

  c.innerHTML = `
    <h2 style="font-size:19px; margin-bottom:4px;">Meu treino & dieta</h2>
    <div style="font-size:12px; color:var(--muted); margin-bottom:14px;">Hoje é ${hoje}</div>
    ${plano.tipo==='mensal' ? `
      <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;">
        ${semanas.map((s,i)=>`<button class="tab-btn ${alunoSemanaAtiva===i?'active':''}" onclick="alunoSemanaAtiva=${i}; renderAlunoPlano(document.getElementById('aluno-content'))">Semana ${s.numero}</button>`).join('')}
      </div>` : ''}
    <h3 style="font-size:14px; margin-bottom:8px;">🏋️ Treino de hoje</h3>
    ${diasHoje.length ? diasHoje.map(dia=>cardTreino(dia,true)).join('') : '<div class="card" style="text-align:center; color:var(--muted); margin-bottom:14px;">Nenhum treino previsto para hoje</div>'}
    ${outrosDias.length ? `
      <h3 style="font-size:13px; margin:18px 0 8px; color:var(--muted);">Outros treinos do plano</h3>
      ${outrosDias.map(dia=>cardTreino(dia,false)).join('')}
    ` : ''}

    <h3 style="font-size:14px; margin:18px 0 8px;">🥗 Dieta de hoje</h3>
    ${plano.caloriasAlvo || plano.restricoes ? `
      <div class="card" style="margin-bottom:14px; font-size:13px;">
        ${plano.caloriasAlvo?`<div><b>Meta:</b> ${escapeHtml(String(plano.caloriasAlvo))} kcal/dia</div>`:''}
        ${plano.restricoes?`<div><b>Restrições:</b> ${escapeHtml(plano.restricoes)}</div>`:''}
        ${plano.observacoesGerais?`<div style="margin-top:6px; color:var(--muted);">${escapeHtml(plano.observacoesGerais)}</div>`:''}
      </div>` : ''}
    ${refeicoesHoje.length ? refeicoesHoje.map(ref=>`
      <div class="card" style="margin-bottom:12px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
          <div style="font-weight:700;">${escapeHtml(ref.nome)}</div>
          <span class="pill pill-gray">${ref.horario||''}</span>
        </div>
        ${(ref.alimentos||[]).map(al=>`
          <div style="font-size:13px; padding:4px 0; border-top:1px solid var(--border);">${escapeHtml(al.nome)} — ${escapeHtml(String(al.quantidade||''))}${escapeHtml(al.unidade||'')}</div>
        `).join('')}
        ${ref.obs?`<div style="font-size:12px; color:var(--muted); margin-top:6px;">${escapeHtml(ref.obs)}</div>`:''}
        <button class="btn btn-accent" style="width:100%; margin-top:12px;" onclick="confirmarRefeicao('${ref.id}')">✅ Marcar refeição como feita</button>
      </div>
    `).join('') : (refeicoesConcluidasHoje.length ? '<div class="card" style="text-align:center; color:var(--muted);">Todas as refeições de hoje já foram confirmadas 🎉</div>' : '<div class="card" style="text-align:center; color:var(--muted);">Nenhuma refeição prevista para hoje</div>')}
    ${refeicoesConcluidasHoje.length ? `
      <div style="margin-top:10px; font-size:12px; color:var(--muted);">
        ✅ Já confirmadas hoje: ${refeicoesConcluidasHoje.map(r=>`<a href="javascript:void(0)" onclick="desfazerRefeicao('${r.id}')" style="color:var(--muted); text-decoration:underline;">${escapeHtml(r.nome)}</a>`).join(', ')}
      </div>
    ` : ''}
    ${outrasRefeicoes.length ? `
      <h3 style="font-size:13px; margin:18px 0 8px; color:var(--muted);">Outras refeições do plano</h3>
      ${outrasRefeicoes.map(ref=>`
        <div class="card" style="margin-bottom:12px;">
          <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
            <div style="font-weight:700;">${escapeHtml(ref.nome)}</div>
            <span class="pill pill-gray">${ref.horario||''}</span>
          </div>
          <div style="font-size:11px; color:var(--muted); margin-bottom:8px;">${escapeHtml(labelRepeticao(ref))}</div>
          ${(ref.alimentos||[]).map(al=>`
            <div style="font-size:13px; padding:4px 0; border-top:1px solid var(--border);">${escapeHtml(al.nome)} — ${escapeHtml(String(al.quantidade||''))}${escapeHtml(al.unidade||'')}</div>
          `).join('')}
          ${ref.obs?`<div style="font-size:12px; color:var(--muted); margin-top:6px;">${escapeHtml(ref.obs)}</div>`:''}
        </div>
      `).join('')}
    ` : ''}
  `;
}
async function toggleCheckin(diaId, exId, el){
  el.classList.toggle('done');
  const done = el.classList.contains('done');
  const ref = db.collection('alunos').doc(currentAlunoDoc.id).collection('checkins');
  const snap = await ref.where('dataStr','==', todayStr()).limit(1).get();
  if(snap.empty){
    await ref.add({dataStr: todayStr(), data: new Date(), exerciciosFeitos: done?[exId]:[]});
  } else {
    const docRef = snap.docs[0].ref;
    const atual = new Set(snap.docs[0].data().exerciciosFeitos||[]);
    if(done) atual.add(exId); else atual.delete(exId);
    await docRef.update({exerciciosFeitos: Array.from(atual)});
  }
}
async function confirmarRefeicao(refId){
  try{
    const ref = db.collection('alunos').doc(currentAlunoDoc.id).collection('checkins');
    const snap = await ref.where('dataStr','==', todayStr()).limit(1).get();
    if(snap.empty){
      await ref.add({dataStr: todayStr(), data: new Date(), refeicoesFeitas: [refId]});
    } else {
      const docRef = snap.docs[0].ref;
      const atual = new Set(snap.docs[0].data().refeicoesFeitas||[]);
      atual.add(refId);
      await docRef.update({refeicoesFeitas: Array.from(atual)});
    }
    toast('Refeição confirmada 🥗','ok');
    renderAlunoPlano(document.getElementById('aluno-content'));
  }catch(err){ toast(err.message,'err'); }
}
async function desfazerRefeicao(refId){
  try{
    const ref = db.collection('alunos').doc(currentAlunoDoc.id).collection('checkins');
    const snap = await ref.where('dataStr','==', todayStr()).limit(1).get();
    if(!snap.empty){
      const docRef = snap.docs[0].ref;
      const atual = new Set(snap.docs[0].data().refeicoesFeitas||[]);
      atual.delete(refId);
      await docRef.update({refeicoesFeitas: Array.from(atual)});
      renderAlunoPlano(document.getElementById('aluno-content'));
    }
  }catch(err){ toast(err.message,'err'); }
}
async function concluirTreino(diaId, nomeTreino, idsExercicios){
  try{
    const ref = db.collection('alunos').doc(currentAlunoDoc.id).collection('checkins');
    const snap = await ref.where('dataStr','==', todayStr()).limit(1).get();
    if(snap.empty){
      await ref.add({
        dataStr: todayStr(), data: new Date(),
        exerciciosFeitos: idsExercicios,
        treinosConcluidos: [{id:diaId, nome:nomeTreino, concluidoEm: new Date().toISOString()}]
      });
    } else {
      const docRef = snap.docs[0].ref;
      const docData = snap.docs[0].data();
      const atualFeitos = new Set(docData.exerciciosFeitos||[]);
      idsExercicios.forEach(id=>atualFeitos.add(id));
      const treinosConcl = docData.treinosConcluidos || [];
      if(!treinosConcl.some(t=>t.id===diaId)) treinosConcl.push({id:diaId, nome:nomeTreino, concluidoEm: new Date().toISOString()});
      await docRef.update({exerciciosFeitos: Array.from(atualFeitos), treinosConcluidos: treinosConcl});
    }
    toast('Treino concluído! Registrado no seu progresso 💪','ok');
    renderAlunoPlano(document.getElementById('aluno-content'));
  }catch(err){ toast(err.message,'err'); }
}

function renderAlunoProgresso(c){ renderTabProgresso(c, currentAlunoDoc); }
function renderAlunoFinanceiro(c){ renderTabFinanceiro(c, currentAlunoDoc); }
function renderAlunoAgenda(c){ renderTabAgenda(c, currentAlunoDoc); }
</script>
